function viewDayInfo(date) {
  const head = extra => `<div class="dhead"><div><b>${esc(dateTitle(date))}</b><small>${esc(wdName(date))}</small></div>${extra || ''}</div>`;
  if (!S.calData.map[date]) return `<div class="panel pad dinfo">${head()}<div class="dmeta">В этот день ничего не было</div></div>`;
  const info = dayCache[date];
  if (!info || info === 'loading') { loadDay(date); return `<div class="panel pad dinfo">${head(typeChip(S.calData.map[date].type))}<div class="dmeta">Загружаю…</div></div>`; }
  if (info.error) return `<div class="panel pad dinfo">${head()}<div class="warn">${esc(info.error)}</div></div>`;
  const player = S.role === 'player', game = info.type === 'игра';
  if (player && info.open) return `<div class="panel pad dinfo">${head(typeChip('игра'))}
    <div class="me ${info.me ? 'ok' : 'no'}"><b>${info.me ? 'Ты на игре ✅' : 'Игра идёт'}</b><span>Сеты, итоги и рейтинг появятся, когда игру завершат</span></div></div>`;
  let me = '';
  if (player) {
    const mine = info.sets.filter(s => s.mine), w = mine.filter(s => s.mine === 'win').length;
    if (!info.me) me = '<div class="me no">В этот день без тебя</div>';
    else if (game && mine.length) me = `<div class="me ok"><b>Твои сеты: ${mine.length}</b><span>${w} ${plural(w, 'победа', 'победы', 'побед')} · ${mine.length - w} ${plural(mine.length - w, 'поражение', 'поражения', 'поражений')}</span></div>`;
    else me = `<div class="me ok"><b>${game ? 'Ты был(а) на игре' : 'Ты был(а) на тренировке'} ✅</b></div>`;
    if (info.myPay) {
      const lbl = (PAY_LABEL[info.myPay.status] || ['', info.myPay.status]);
      me += `<div class="me pay"><span>Оплата: <b>${info.myPay.amount} ¥</b></span><span class="chip ${lbl[0]}">${lbl[1] === 'ждём чек' ? 'ждём чек в боте' : lbl[1]}</span></div>`;
    }
  }
  const sets = info.sets.map(s => `<div class="srow ${s.mine}"><span class="no">${s.num}</span>
      <span class="res"><i class="t${s.t1} ${s.winner === s.t1 ? 'w' : ''}" style="--tc: var(--${s.t1})">${s.t1}</i> ${s.sc1}:${s.sc2} <i class="t${s.t2} ${s.winner === s.t2 ? 'w' : ''}" style="--tc: var(--${s.t2})">${s.t2}</i></span>
      ${s.mine ? `<span class="chip ${s.mine === 'win' ? 'ok' : 'bad'}">${s.mine === 'win' ? 'победа' : 'поражение'}${s.side ? ', ты в ' + s.side : ''}</span>` : ''}</div>`).join('');
  const admin = !player ? `
    ${info.pay ? `<div class="me ${info.pay.paid === info.pay.total ? 'ok' : ''}"><b>Оплатили ${info.pay.paid} из ${info.pay.total}</b></div>` : ''}
    ${info.people && info.people.length ? `<div class="people">${info.people.map(n => `<span>${esc(n)}</span>`).join('')}</div>` : ''}
    <button class="btn inline" data-a="openDay" data-d="${date}">${info.open ? 'Открыть, игра идёт' : 'Открыть день'}</button>` : '';
  return `<div class="panel pad dinfo">${head(typeChip(info.type))}
    <div class="dmeta">${info.n} ${plural(info.n, 'человек', 'человека', 'человек')}${game ? ` · ${info.sets.length} ${plural(info.sets.length, 'сет', 'сета', 'сетов')}` : ''}</div>
    ${me}${sets ? `<div class="sets ${player ? 'pl' : ''}">${sets}</div>` : ''}${admin}</div>`;
}

/* ---------- счёт за тренировку ---------- */
// Сумма с человека: аренда / участников + доплата за инвентарь, вверх до целого юаня (как на сервере).
function billCalc(rent, n, extra) {
  const per = rent / n, amount = Math.ceil(Math.round((per + extra) * 100) / 100);
  return { perRent: Math.round(per * 100) / 100, amount, total: amount * n, rounding: Math.round((amount * n - rent - extra * n) * 100) / 100 };
}
const yuan = x => String(Math.round(x * 100) / 100).replace('.', ',') + ' ¥';
const billText = (date, phrase, amount) => `🏐 Спасибо за тренировку ${dateTitle(date)}!\n\n${phrase}\n\n💳 К оплате: ${amount} ¥ на Алипей по QR-коду выше.\nПосле оплаты пришли сюда скриншот чека 📸`;
const PAY_LABEL = { 'ждём чек': ['wait', 'ждём чек'], 'чек получен': ['ok', 'чек получен'], 'оплачено': ['ok', 'оплачено вручную'],
  'нет в боте': ['bad', 'нет в боте, напиши сам'], 'не доставлено': ['bad', 'не доставлено'] };

// Перед расчётом убеждаемся, что отметки уже на сервере: он считает по сохранённому списку.
async function syncNow() {
  saveNow(); flush();
  const t0 = Date.now();
  while ((outbox.length || flushing) && Date.now() - t0 < 15000) await new Promise(r => setTimeout(r, 300));
  if (outbox.length) throw new Error('Отметки ещё не сохранились, проверь связь');
}

async function openBill() {
  S.bill = { date: S.date, rent: '', st: null, busy: true, err: '', armed: false };
  render(); window.scrollTo(0, 0);
  try {
    await syncNow();
    const st = await api('api_billPreview', S.date, 0);
    S.bill.st = st;
    S.bill.rent = st.sent ? String(st.rent) : (st.lastRent ? String(st.lastRent) : '');
  } catch (e) { S.bill.err = msg(e).replace(/^.*ОШИБКА:\s*/, ''); }
  S.bill.busy = false; render();
}

function billCalcNow() {
  const b = S.bill, st = b.st, rent = Number(String(b.rent).replace(',', '.')) || 0;
  if (st.sent) return st.calc;
  return rent > 0 && st.n ? billCalc(rent, st.n, st.extra) : null;
}

function billCalcHtml() {
  const st = S.bill.st, c = billCalcNow();
  if (!c) return '<div class="hintc">Введи стоимость аренды, и я посчитаю сумму с каждого</div>';
  return `<div class="crow"><span>Аренда на человека</span><b>${yuan(c.perRent)}</b></div>
    <div class="crow"><span>Инвентарь</span><b>+ ${yuan(st.extra)}</b></div>
    <div class="crow big"><span>К оплате с человека</span><b>${c.amount} ¥</b></div>
    <div class="crow"><span>Всего соберём с ${st.n}</span><b>${yuan(c.total)}</b></div>
    <div class="hintc">Аренда ${yuan(c.total - st.extra * st.n - c.rounding)} + инвентарь ${yuan(st.extra * st.n)} + округление ${yuan(c.rounding)}. Расчёт видишь только ты, игрокам придёт только сумма.</div>`;
}

function billSendLabel() {
  const st = S.bill.st, bots = st.people.filter(p => p.bot && (!st.sent || !p.status)).length;
  return S.bill.armed ? `Точно разослать ${bots}?` : (st.sent ? `Дослать новым (${bots})` : `Разослать счёт (${bots})`);
}

function billCanSend() {
  const st = S.bill.st, c = billCalcNow();
  const bots = st.people.filter(p => p.bot && (!st.sent || !p.status)).length;
  return !!(c && st.qr && bots && !S.bill.busy);
}

function viewBill() {
  const b = S.bill, st = b.st;
  const back = `<button class="btn" data-a="billClose">Назад</button>`;
  if (!st) return { action: back, html: `<h2>Счёт за тренировку</h2>${b.err ? `<div class="panel pad"><div class="warn">${esc(b.err)}</div></div>` : '<div class="empty">Считаю…</div>'}` };
  const c = billCalcNow();
  const paid = st.people.filter(p => p.status === 'чек получен' || p.status === 'оплачено');
  const people = st.people.map(p => {
    let chip;
    if (p.status) chip = PAY_LABEL[p.status] || ['', p.status];
    else chip = p.bot ? ['', st.sent ? 'новый, ещё не отправлено' : 'получит сообщение'] : ['bad', 'нет в боте, напиши сам'];
    const tap = st.sent && p.status ? `data-a="billMark" data-id="${esc(p.id)}"` : '';
    return `<button class="brow" ${tap} ${tap ? '' : 'disabled'}><span class="nm">${esc(p.name)}</span><span class="chip ${chip[0]}">${chip[1]}</span></button>`;
  }).join('');
  const sentHead = st.sent ? `<div class="panel pad paid"><b>Оплатили ${paid.length} из ${st.n}</b>
      <span>Собрано ${paid.reduce((s, p) => s + p.amount, 0)} из ${yuan(st.calc.total)} · разослано ${esc(st.sent.at)}</span>
      <span>Нажми на игрока, чтобы отметить оплату вручную (наличными или чек пришёл не в бот).</span></div>` : '';
  const action = `${back}${st.sent ? `<button class="btn" data-a="billRefresh">Обновить</button>` : ''}
    ${!st.sent || st.people.some(p => p.bot && !p.status) ? `<button class="btn go" data-a="billSend" ${billCanSend() ? '' : 'disabled'}>${billSendLabel()}</button>` : ''}`;
  return { action, html: `
    <h2>Счёт за тренировку</h2>
    <p class="lead">${esc(dateTitle(st.date))}, ${st.n} ${plural(st.n, 'участник', 'участника', 'участников')} без тебя</p>
    ${sentHead}
    <div class="panel pad">
      ${st.sent ? `<div class="crow"><span>Аренда зала</span><b>${yuan(st.rent)}</b></div>`
        : `<label class="f">Аренда зала, ¥<input id="f_rent" type="number" inputmode="decimal" min="0" step="1" value="${esc(b.rent)}" placeholder="например, 300"></label>`}
      <div id="calc">${billCalcHtml()}</div>
    </div>
    <div class="panel pad qrbox"><div class="qr" style="${st.qr ? `background-image:url('${esc(st.qr)}')` : ''}">${st.qr ? '' : 'QR'}</div>
      <div><b>QR-код Алипея</b><small>${st.qr ? 'Уйдёт картинкой в каждом сообщении' : 'Загрузи скриншот своего QR для оплаты'}</small>
      <label class="lnk">${st.qr ? 'Заменить' : 'Загрузить QR'}<input type="file" id="f_qr" accept="image/*"></label></div></div>
    <p class="sub-h">Так увидят игроки</p>
    <div class="msg"><div class="msgqr" style="${st.qr ? `background-image:url('${esc(st.qr)}')` : ''}"></div><div id="msgText">${esc(c ? billText(st.date, st.phrase, c.amount) : 'Сообщение появится, когда введёшь аренду')}</div></div>
    <p class="sub-h">Участники</p>
    <div class="panel">${people || '<div class="empty">Никто не отмечен</div>'}</div>` };
}

async function billSend() {
  if (!S.bill.armed) { S.bill.armed = true; render(); setTimeout(() => { if (S.bill && S.bill.armed) { S.bill.armed = false; render(); } }, 4000); return; }
  S.bill.armed = false; S.bill.busy = true; render();
  try {
    await syncNow();
    const st = await api('api_billSend', S.bill.date, Number(String(S.bill.rent).replace(',', '.')) || 0);
    S.bill.st = st;
    toast(`Разослано: ${st.result.sent}` + (st.result.failed.length ? `. Не дошло: ${st.result.failed.join(', ')}` : ''));
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch (e) { toast('Не разослано: ' + msg(e).replace(/^.*ОШИБКА:\s*/, '')); }
  S.bill.busy = false; render();
}

async function billCall(fn, ...args) {
  S.bill.busy = true;
  try { S.bill.st = await api(fn, ...args); } catch (e) { toast(msg(e).replace(/^.*ОШИБКА:\s*/, '')); }
  S.bill.busy = false; render();
}

// QR не сжимаем сильно: до 1000 px на белом фоне, чтобы код уверенно сканировался.
function readQr(file) {
  const img = new Image(), fr = new FileReader();
  fr.onload = () => { img.src = fr.result; };
  img.onload = async () => {
    const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    let data = c.toDataURL('image/png');
    if (data.length > 2500000) data = c.toDataURL('image/jpeg', 0.92);
    toast('Загружаю QR…');
    try { const r = await api('api_setQr', data); S.bill.st.qr = r.qr; toast('QR сохранён'); }
    catch (e) { toast('QR не сохранился: ' + msg(e).replace(/^.*ОШИБКА:\s*/, '')); }
    render();
  };
  fr.readAsDataURL(file);
}

/* ---------- календарь ---------- */
/** Сетка месяца. info(iso) → { type, hollow }: зелёный кружок игра, чёрный тренировка, контур «без тебя». */
function monthGrid(y, m, action, sel, info) {
  const first = new Date(y, m, 1), start = (first.getDay() + 6) % 7;
  const total = Math.ceil((start + new Date(y, m + 1, 0).getDate()) / 7) * 7;
  const cells = [];
  for (let i = 0; i < total; i++) {
    const d = new Date(y, m, 1 - start + i);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const t = info(iso), kind = t ? (t.type === 'тренировка' ? 'k-tr' : 'k-g') + (t.hollow ? ' hollow' : '') : '';
    cells.push(`<button class="day ${d.getMonth() !== m ? 'out' : ''} ${iso === S.today ? 'today' : ''} ${iso === sel ? 'sel' : ''} ${kind}" data-a="${action}" data-d="${iso}">
      <span>${d.getDate()}</span></button>`);
  }
  return cells.join('');
}
const monthTitle = (y, m) => new Date(y, m, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).replace(' г.', '');
const WEEK_HEAD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<span class="${d === 'Сб' ? 'sat' : ''}">${d}</span>`).join('');

function renderCal() {
  const o = $('#overlay');
  if (!S.cal) { setHTML(o, ''); return; }
  const { y, m } = S.cal;
  const title = monthTitle(y, m);
  const pickType = S.cal.pickType;
  const cells = [monthGrid(y, m, 'pick', pickType ? '' : S.date, iso => S.days[iso] ? { type: S.days[iso] } : null)];
  setHTML(o, `<div class="scrim" data-a="calClose"></div>
    <div class="sheet" role="dialog" aria-label="Выбор даты"><div class="grab"></div>
      <div class="calh"><button class="arw" data-a="calPrev" aria-label="Предыдущий месяц">‹</button><b>${title}</b><button class="arw" data-a="calNext" aria-label="Следующий месяц">›</button></div>
      ${pickType ? `<div class="picktitle">${pickType === 'игра' ? 'Игра' : 'Тренировка'}: выбери день</div>` : ''}
      <div class="wk">${WEEK_HEAD}</div>
      <div class="days">${cells.join('')}</div>
      <div class="legend"><span><i></i>игра</span><span><i class="tr"></i>тренировка</span><span><i class="today"></i>сегодня</span></div>
      <button class="btn go" data-a="pick" data-d="${S.today}">Сегодня</button></div>`);
}

let toastT = null;
function toast(text) {
  const el = $('#toast');
  el.textContent = text; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ---------- события ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a],[data-tab],[data-type]');
  if (!b || b.disabled) return;
  if (b.dataset.tab) {
    S.tab = b.dataset.tab; S.armed = null; S.edit = null; S.bill = null; S.fromSet = false; S.setEdit = null;
    if (S.tab === 'board' || S.tab === 'me') S.stats = null;
    if (S.tab === 'self') { S.self.stats = null; S.self.edit = false; }
    if (S.tab === 'cal' || S.tab === 'home') { S.calData = null; S.calSel = ''; S.calM = null; Object.keys(dayCache).forEach(k => delete dayCache[k]); }   // свежие данные, открываем на последнем дне
    render(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.type) {
    if (S.type === b.dataset.type) return;
    S.type = b.dataset.type;
    if (S.type === 'тренировка' && (S.tab === 'teams' || S.tab === 'set')) S.tab = 'att';
    scheduleSave(); render(); return;
  }
  const a = b.dataset.a, id = b.dataset.id, t = b.dataset.t;
  switch (a) {
    case 'reload': load(S.date); break;
    case 'cal': { const d = new Date((S.date || S.today) + 'T12:00:00'); S.cal = { y: d.getFullYear(), m: d.getMonth() }; renderCal(); break; }
    case 'calClose': S.cal = null; renderCal(); break;
    case 'calPrev': S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } renderCal(); break;
    case 'calNext': S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } renderCal(); break;
    case 'pick': { const t = S.cal && S.cal.pickType; S.cal = null; renderCal(); if (t || b.dataset.d !== S.date) openDay(b.dataset.d, t); break; }
    case 'start': { const d = new Date(S.today + 'T12:00:00'); S.cal = { y: d.getFullYear(), m: d.getMonth(), pickType: b.dataset.t }; renderCal(); break; }
    case 'openDay': openDay(b.dataset.d, null); break;
    case 'home': saveNow(); S.tab = 'home'; S.bill = null; S.edit = null; S.calData = null; render(); window.scrollTo(0, 0); break;
    case 'calSel': S.calSel = b.dataset.d; render(); break;
    case 'cmPrev': S.calM.m--; if (S.calM.m < 0) { S.calM.m = 11; S.calM.y--; } render(); break;
    case 'cmNext': S.calM.m++; if (S.calM.m > 11) { S.calM.m = 0; S.calM.y++; } render(); break;
    case 'toggle':
      if (S.present.has(id)) { S.present.delete(id); delete S.team[id]; } else S.present.add(id);
      scheduleSave(); render(); break;
    case 'new': S.edit = { lastName: S.q.trim() ? S.q.trim().replace(/^./, c => c.toUpperCase()) : '' }; render(); window.scrollTo(0, 0); break;
    case 'edit': S.edit = Object.assign({}, S.players.find(p => p.id === id)); render(); window.scrollTo(0, 0); break;
    case 'cancelEdit': S.edit = null; render(); break;
    case 'saveCard': saveCard(); break;
    case 'saveMyCard': saveMyCard(); break;
    case 'bill': openBill(); break;
    case 'billClose': S.bill = null; render(); window.scrollTo(0, 0); break;
    case 'billSend': billSend(); break;
    case 'billRefresh': billCall('api_billPreview', S.bill.date, 0); break;
    case 'billMark': billCall('api_billMark', S.bill.date, id); break;
    case 'selfEdit': S.self.edit = true; render(); window.scrollTo(0, 0); break;
    case 'selfCancel': S.self.edit = false; if (S.me) delete S.me.photoNew; render(); window.scrollTo(0, 0); break;
    case 'toTeams': S.tab = 'teams'; render(); window.scrollTo(0, 0); break;
    case 'toSet': {
      S.fromSet = false; S.tab = 'set';
      const short = shortTeams(S.pair || TEAMS);
      if (short.length) toast('Неполный состав: ' + short.map(t => `${t} ${teamFill(t).tot} из ${S.teamSize}`).join(', '));
      render(); window.scrollTo(0, 0); break;
    }
    case 'toTeamsSet': S.fromSet = true; S.tab = 'teams'; render(); window.scrollTo(0, 0); break;
    case 'finish':
      if (S.armed !== 'finish') { S.armed = 'finish'; render(); setTimeout(() => { if (S.armed === 'finish') { S.armed = null; render(); } }, 4000); break; }
      S.armed = null; saveNow();
      enqueue({ kind: 'fin', date: S.date });
      S.done = true; S.sum = null; S.tab = 'sum';
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      toast('Игра завершена. Игроки увидят итоги и рейтинг');
      render(); window.scrollTo(0, 0); break;
    case 'sumRetry': S.sum = null; render(); break;
    case 'fix': S.armed = S.armed === 'fix' ? null : 'fix'; render(); break;
    case 'fixCancel': S.armed = null; render(); break;
    case 'fixAtt': S.armed = null; S.fix = 'att'; S.tab = 'att'; render(); window.scrollTo(0, 0); break;
    case 'fixSets': S.armed = null; S.fix = 'sets'; S.tab = 'log'; render(); window.scrollTo(0, 0); break;
    case 'fixDone':
      saveNow(); S.fix = null; S.setEdit = null; S.sum = null; S.stats = null; S.tab = 'sum';
      toast('Сохранено, итоги пересчитаются'); render(); window.scrollTo(0, 0); break;
    case 'editSet': {
      const s0 = S.sets.find(x => x.id === id);
      if (s0) S.setEdit = JSON.parse(JSON.stringify(s0));
      S.armed = null; render(); window.scrollTo(0, 0); break;
    }
    case 'eCancel': S.setEdit = null; S.armed = null; render(); break;
    case 'eSave': saveSetEdit(); break;
    case 'eg-': case 'eg+': { const k = b.dataset.k; S.setEdit[k] = Math.max(0, Math.min(12, S.setEdit[k] + (a === 'eg+' ? 1 : -1))); render(); break; }
    case 'emove': {
      const e2 = S.setEdit;
      e2.sc1 = Number($('#e_sc1').value); e2.sc2 = Number($('#e_sc2').value);   // не теряем введённый счёт
      e2.r1 = e2.r1.filter(x => x !== id); e2.r2 = e2.r2.filter(x => x !== id);
      if (t === e2.t1) e2.r1.push(id); else if (t === e2.t2) e2.r2.push(id);
      render(); break;
    }
    case 'edel':
      if (S.armed !== 'edel') { S.armed = 'edel'; render(); break; }
      S.armed = null;
      S.sets = S.sets.filter(s => s.id !== S.setEdit.id);
      enqueue({ kind: 'del', id: S.setEdit.id });
      toast(`Сет №${S.setEdit.num} удалён`);
      S.setEdit = null; S.sum = null; render(); break;
    case 'help': S.help = !S.help; render(); break;
    case 'toCal':
      S.tab = 'cal'; S.calData = null; S.calSel = ''; S.calM = null; S.calWant = true;
      Object.keys(dayCache).forEach(k => delete dayCache[k]);
      render(); window.scrollTo(0, 0); break;
    case 'team':
      if (S.team[id] === t) delete S.team[id]; else S.team[id] = t;
      scheduleSave(); render(); break;
    case 'size-': S.size[t] = Math.max(roster(t).length, sizeOf(t) - 1); scheduleSave(); render(); break;   // убавляем только китайцев
    case 'size+': S.size[t] = Math.min(12, Math.max(sizeOf(t), roster(t).length) + 1); scheduleSave(); render(); break;
    case 'pair': S.pair = b.dataset.p.split(''); S.pick = { w: null, l: null, low: false }; scheduleSave(); render(); break;
    case 'win': S.pick.w = t; render(); break;
    case 'score': S.pick.l = Number(b.dataset.n); render(); break;
    case 'low': S.pick.low = true; render(); break;
    case 'l-': S.pick.l = Math.max(24, S.pick.l - 1); render(); break;
    case 'l+': S.pick.l = S.pick.l + 1; render(); break;
    case 'record': recordSet(); break;
    case 'boardTab': S.board = b.dataset.k; render(); break;
    case 'scope': S.scope = b.dataset.k; render(); break;
    case 'del':
      if (S.armed !== id) { S.armed = id; render(); setTimeout(() => { if (S.armed === id) { S.armed = null; render(); } }, 4000); break; }
      S.armed = null;
      S.sets = S.sets.filter(s => s.id !== id);
      enqueue({ kind: 'del', id });
      S.pair = nextPair() || S.pair;
      scheduleSave(); toast('Сет удалён'); render(); break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; setHTML($('#attList'), attList()); }
  if ((e.target.id === 'e_sc1' || e.target.id === 'e_sc2') && S.setEdit) {
    S.setEdit[e.target.id.slice(2)] = Number(e.target.value);
    $('#ewin').textContent = winText(S.setEdit);
  }
  if (e.target.id === 'f_rent' && S.bill) {
    S.bill.rent = e.target.value; S.bill.armed = false;
    const c = billCalcNow(), st = S.bill.st;
    setHTML($('#calc'), billCalcHtml());
    $('#msgText').textContent = c ? billText(st.date, st.phrase, c.amount) : 'Сообщение появится, когда введёшь аренду';
    const btn = document.querySelector('[data-a="billSend"]');
    if (btn) { btn.disabled = !billCanSend(); btn.textContent = billSendLabel(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f_qr' && e.target.files[0]) { readQr(e.target.files[0]); return; }
  if (e.target.id !== 'f_photo' || !e.target.files[0]) return;
  const img = new Image(), fr = new FileReader();
  fr.onload = () => { img.src = fr.result; };
  img.onload = () => {     // уменьшаем до 400px, чтобы фото быстро грузилось и не занимало место
    const k = Math.min(1, 400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.82);
    if (S.edit) S.edit.photoNew = data;                     // админ правит чью-то карточку
    else S.me = Object.assign({}, S.me, { photoNew: data }); // своя карточка
    const ava = $('#ava'); ava.style.backgroundImage = `url('${data}')`; ava.textContent = '';
  };
  fr.readAsDataURL(e.target.files[0]);
});

if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#FFFFFF'); tg.setBackgroundColor('#F2F5F1'); } catch (e) {} }
load('');
